name: Release

on:
  push:
    branches:
      - main
  # Manual re-trigger: GitHub occasionally skips the push-triggered run for a
  # merge, leaving release-please without a chance to open the next Release PR.
  # Dispatching this workflow re-scans main and opens it. release-please is
  # idempotent, so re-running is safe.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: rust

  build:
    name: Build ${{ matrix.os }}
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: memory-rs
            asset_name: memory-rs-linux-x86_64
          - os: macos-14
            artifact_name: memory-rs
            asset_name: memory-rs-macos-aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build release binary
        run: cargo build --release

      - name: Rename binary
        shell: bash
        run: |
          mv target/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}

      # Developer ID-sign + notarize the macOS binary so it runs without a
      # Gatekeeper exception. A bare Mach-O can't be stapled, but notarizing
      # registers it with Apple so first-run passes. The signed binary is what
      # gets uploaded, so the later checksum covers the signed bytes.
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          codesign --force --timestamp --options runtime \
            --keychain "$KEYCHAIN" --sign "$IDENTITY" "${{ matrix.asset_name }}"
          codesign --verify --strict --verbose=2 "${{ matrix.asset_name }}"

          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k "${{ matrix.asset_name }}" "$RUNNER_TEMP/notarize.zip"
          # Apple's notary service can be slow and its status endpoint
          # occasionally drops the polling connection (-1009), which kills
          # --wait. Retry the whole submit-and-wait so a transient blip doesn't
          # fail the release; --timeout bounds each attempt.
          notarized=false
          for attempt in 1 2 3; do
            if xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
              --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" \
              --wait --timeout 30m; then
              notarized=true
              break
            fi
            echo "notarize attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/notarize.zip"
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          [ "$notarized" = true ] || { echo "notarization failed after retries"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          retention-days: 1

  upload-assets:
    name: Upload Release Assets
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Upload assets to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} artifacts/* --repo ${{ github.repository }}
